<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Observability dashboard illustration">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183581"/>
      <stop offset="1" stop-color="#1a56f0"/>
    </linearGradient>
    <linearGradient id="lineR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ad8e0"/>
      <stop offset="1" stop-color="#8ec0ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgR)"/>
  <!-- dashboard panel -->
  <rect x="60" y="60" width="520" height="240" rx="18" fill="#ffffff" opacity="0.95"/>
  <rect x="60" y="60" width="520" height="46" rx="18" fill="#eef4ff"/>
  <circle cx="86" cy="83" r="6" fill="#ff6b6b"/>
  <circle cx="108" cy="83" r="6" fill="#ffcf5c"/>
  <circle cx="130" cy="83" r="6" fill="#2ad8e0"/>
  <!-- line chart -->
  <polyline points="90,250 150,210 210,230 270,170 330,190 390,130 450,160 510,110 550,130"
            fill="none" stroke="url(#lineR)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#1a56f0">
    <circle cx="270" cy="170" r="5"/>
    <circle cx="390" cy="130" r="5"/>
    <circle cx="510" cy="110" r="5"/>
  </g>
  <!-- bars -->
  <g fill="#8ec0ff">
    <rect x="90" y="268" width="18" height="18" rx="3"/>
    <rect x="120" y="258" width="18" height="28" rx="3"/>
    <rect x="150" y="264" width="18" height="22" rx="3"/>
  </g>
  <!-- SLO chip -->
  <g transform="translate(430 250)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#06b6c4"/>
    <text x="18" y="23" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffffff">99.95% SLO</text>
  </g>
</svg>
