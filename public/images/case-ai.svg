<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="GenAI solution illustration">
  <defs>
    <linearGradient id="bgAI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a56f0"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgAI)"/>
  <g opacity="0.12" stroke="#fff" stroke-width="1">
    <path d="M0 90H640M0 180H640M0 270H640"/>
    <path d="M160 0V360M320 0V360M480 0V360"/>
  </g>
  <!-- neural network nodes -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.65">
    <path d="M150 110 300 90 M150 110 300 180 M150 250 300 180 M150 250 300 270"/>
    <path d="M300 90 460 140 M300 180 460 140 M300 180 460 230 M300 270 460 230"/>
  </g>
  <g fill="#ffffff">
    <circle cx="150" cy="110" r="12"/>
    <circle cx="150" cy="250" r="12"/>
    <circle cx="300" cy="90" r="12"/>
    <circle cx="300" cy="180" r="14"/>
    <circle cx="300" cy="270" r="12"/>
    <circle cx="460" cy="140" r="12"/>
    <circle cx="460" cy="230" r="12"/>
  </g>
  <!-- prompt / chat card -->
  <g transform="translate(430 70)">
    <rect width="160" height="90" rx="14" fill="#ffffff" opacity="0.96"/>
    <rect x="16" y="20" width="110" height="10" rx="5" fill="#7c3aed"/>
    <rect x="16" y="40" width="128" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="16" y="56" width="90" height="8" rx="4" fill="#ddd6fe"/>
  </g>
  <!-- sparkle -->
  <g transform="translate(508 250)" fill="#ffffff">
    <path d="M0 -22 6 -6 22 0 6 6 0 22 -6 6 -22 0 -6 -6Z"/>
  </g>
  <!-- badge -->
  <g transform="translate(40 290)">
    <rect width="150" height="34" rx="17" fill="#ffffff" opacity="0.92"/>
    <text x="18" y="23" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#1a56f0">GenAI in production</text>
  </g>
</svg>
