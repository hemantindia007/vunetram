<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="Cloud architecture illustration">
  <defs>
    <linearGradient id="aLay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3377ff"/>
      <stop offset="1" stop-color="#2ad8e0"/>
    </linearGradient>
    <filter id="aSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f204e" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- connectors -->
  <g stroke="#8ec0ff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M280 120V175"/>
    <path d="M160 300V250H280"/>
    <path d="M400 300V250H280"/>
    <path d="M280 250V210"/>
  </g>

  <!-- top: cloud -->
  <g filter="url(#aSh)">
    <rect x="200" y="40" width="160" height="80" rx="18" fill="#ffffff"/>
    <path d="M242 92a18 18 0 0 1 2-35 23 23 0 0 1 43 6 16 16 0 0 1-4 29Z" fill="url(#aLay)"/>
    <text x="312" y="86" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f204e">Cloud</text>
  </g>

  <!-- middle: orchestration -->
  <g filter="url(#aSh)">
    <rect x="210" y="175" width="140" height="60" rx="14" fill="#ffffff"/>
    <circle cx="244" cy="205" r="14" fill="none" stroke="#1a56f0" stroke-width="4"/>
    <path d="M244 205l10-6M244 205l-10-6M244 205v12" stroke="#1a56f0" stroke-width="3" stroke-linecap="round"/>
    <text x="268" y="210" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f204e">K8s</text>
  </g>

  <!-- bottom nodes -->
  <g filter="url(#aSh)">
    <rect x="90" y="300" width="140" height="90" rx="14" fill="#ffffff"/>
    <rect x="110" y="322" width="100" height="12" rx="6" fill="#1a56f0"/>
    <rect x="110" y="344" width="100" height="10" rx="5" fill="#bcd9ff"/>
    <rect x="110" y="362" width="70" height="10" rx="5" fill="#d9eaff"/>
  </g>
  <g filter="url(#aSh)">
    <rect x="330" y="300" width="140" height="90" rx="14" fill="#ffffff"/>
    <polyline points="350,372 378,352 400,362 430,330 452,344" fill="none" stroke="#06b6c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="400" cy="362" r="4" fill="#1a56f0"/>
    <circle cx="430" cy="330" r="4" fill="#1a56f0"/>
  </g>

  <!-- floating chips -->
  <g filter="url(#aSh)">
    <rect x="40" y="150" width="110" height="36" rx="18" fill="#ffffff"/>
    <circle cx="64" cy="168" r="7" fill="#06b6c4"/>
    <text x="80" y="173" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#0f204e">Secure</text>
  </g>
  <g filter="url(#aSh)">
    <rect x="410" y="150" width="120" height="36" rx="18" fill="#ffffff"/>
    <circle cx="434" cy="168" r="7" fill="#1a56f0"/>
    <text x="450" y="173" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#0f204e">Automated</text>
  </g>
</svg>
